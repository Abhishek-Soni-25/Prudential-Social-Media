# Runtime configuration. Secrets live in .env, NOT here.

poll_interval_seconds: 120      # how often the continuous loop polls each connector
max_items_per_poll: 80          # store up to this many items per channel per scan

# AI risk-analysis core (Gemini)
analysis:
  # LLM provider: Groq. Ordered fallback chain (rolls over if a model's DAILY quota is hit).
  provider: groq
  models:
    - llama-3.3-70b-versatile   # primary
    - llama-3.1-8b-instant      # fallback — separate, much larger free daily quota
  max_tokens: 1024
  requests_per_minute: 25       # Groq free tier allows ~30 req/min for this model
  max_retries: 3                # retries on 429 (honors the suggested retry delay)
  # VADER compound score below which we still always send to the LLM regardless
  # (negative content gets analyzed even if short).
  negative_prefilter_threshold: -0.2

# Media Compliance analyzer — screens marketing creatives against SEBI / NSE / BSE / NSDL /
# CDSL advertising rules using a Groq vision model.
compliance:
  vision_model: "qwen/qwen3.6-27b"   # Groq multimodal (image + video-frame OCR). NOTE: llama-4-scout was decommissioned by Groq (404). Verify with GET /v1/models before changing.
  transcribe_model: "whisper-large-v3-turbo"                  # Groq audio → voice-over transcript
  text_model: "llama-3.3-70b-versatile"                       # Groq text model → compliant post suggestions
  max_tokens: 1600
  # Video frame-by-frame OCR: sample up to frame_ocr_max frames across the clip and OCR
  # them in batches of frame_ocr_batch (the vision model accepts ~5 images per call).
  frame_ocr_max: 12
  frame_ocr_batch: 3   # qwen vision accepts at most 3 images per call
  frame_fps: 1        # frames sampled per second before thinning to frame_ocr_max
  frame_scan_cap: 90  # never decode more than this many frames from a clip
  frame_width: 640    # downscale width for OCR frames (image tokens scale with resolution)

# Monitoring target — every channel is narrowed to content about this organization.
target:
  name: "Prudential Singapore"
  # Content is considered relevant if it mentions any alias (case-insensitive), comes
  # from an official handle, or arrives from a search query for the target.
  aliases:
    - "Prudential"
    - "Prudential Singapore"
    - "Prudential SG"
    - "PruSG"
    - "Prudential Assurance Singapore"
    - "Prudential Assurance Company Singapore"
    - "PACS"
    - "@prudentialsg"
    - "prudential.com.sg"
  official_handles:           # treated as first-party (always relevant)
    - "prudentialsingapore"
    - "prudentialsg"
  require_relevance: true     # drop content that doesn't reference the target

# Alerting thresholds — minimum LLM confidence required to raise an alert at each tier.
thresholds:
  high_min_confidence: 0.70
  medium_min_confidence: 0.55
  low_min_confidence: 0.40

# Keyword-based collection (API Integration Specification). A single keyword is submitted to
# each provider; these default to the target aliases but can be overridden per channel.
keywords:
  - "Prudential Singapore"

# Competitor set for Share-of-Voice benchmarking (PRD 6.6). Each is collected on the
# channels below with its own keyword, counted and sentiment-scored (no risk mapping).
competitors:
  channels: ["linkedin", "instagram", "quora"]   # fast, reliable, no-cookie-timeout channels
  max_items: 5                                     # keep the competitor pass cheap
  set:
    - name: "AIA Singapore"
      keyword: "AIA Singapore"
    - name: "Great Eastern"
      keyword: "Great Eastern Life Singapore"
    - name: "Income Insurance"
      keyword: "Income Insurance Singapore"
    - name: "Manulife Singapore"
      keyword: "Manulife Singapore"

# Legacy: live Reddit + LinkedIn via an n8n Google-search agent. Superseded by Bright Data /
# Apify below; kept so `mode: n8n` still works during migration.
n8n:
  webhook_url: "https://babbumaan.app.n8n.cloud/webhook/420d11f0-a2be-4d23-baf1-ac3aa2ae45ba"

# --- Bright Data Web Scraper (async job model) — YouTube, Reddit, wider web/SERP ---
# Dataset ids from the API Integration Specification (section 4.2). API key in .env.
brightdata:
  poll_timeout_seconds: 150     # cap so a slow/stuck discovery job can't hang the whole scan
  datasets:
    reddit_posts:     "gd_lvz8ah06191smkebj4"   # Reddit — discover posts by keyword
    youtube_videos:   "gd_lk56epmy2i5g7lzu0k"   # YouTube — discover videos by keyword
    youtube_channels: "gd_lk538t2k2p1k3oos71"   # YouTube — discover channels by keyword
    # web_serp:       "<dataset_id>"            # Wider web / SERP — add the dataset id

# --- Apify Actors (async actor run) — LinkedIn, Instagram, Telegram, Quora ---
# Actor ids and input schemas taken from the actor readmes you provided. Each actor is
# normalised per-platform in src/connectors/apify_connector.py to only the fields we use.
apify:
  run_timeout_seconds: 420
  actors:
    instagram:                              # crawlerbros/instagram-keyword-search-scraper
      id: "OQkrGAtl0AfRFKnJr"
      keyword_field: keywords
      keyword_as_list: true
      input_template:
        maxPosts: 60                        # $0.05 start + ~$0.0043/result
      secret_inputs:                        # actor_input_field: ENV_VAR
        cookies: INSTAGRAM_SESSION_COOKIES
    telegram:                               # telegram keyword search scraper (near-free)
      id: "kCdMrRb7UiSRSFYeO"
      keyword_field: keywords
      keyword_as_list: true
      input_template:
        mode: keyword
        afterDate: "180 days"              # wider window
        maxResultsPerKeyword: 100
    linkedin:                               # harvestapi/linkedin-post-search — $0.002/post (cheap)
      id: "buIWk2uOUzTmcLsuB"
      keyword_field: searchQueries
      keyword_as_list: true
      input_template:
        postedLimit: "3months"             # widest window this actor supports reliably
        sortBy: "date"
        maxPosts: 120
        scrapeReactions: false
        scrapeComments: false
    quora:                                  # crawlerbros/quora-scraper — EXPENSIVE ($0.10/q + $0.05/answer); kept modest
      id: "BfPg8oJbuhM5M8h4d"
      keyword_field: searchQuery
      keyword_as_list: false
      input_template:
        maxQuestions: 10
        scrapeAnswers: true
        maxAnswersPerQuestion: 3
      secret_inputs:
        cookies: QUORA_SESSION_COOKIES

# Which channels to run and how.
#   mode: brightdata -> Bright Data dataset (keyword discovery)
#   mode: apify      -> Apify Actor run (keyword search)
#   mode: live       -> the channel's own official-API connector (e.g. X via tweepy)
#   mode: n8n        -> legacy n8n webhook (reddit + linkedin)
#   mode: demo       -> sample pool in data/demo_samples.json
# A channel is skipped with a warning if its provider credentials are missing in .env.
channels:                        # Apify (fast, reliable) first; Bright Data (slower) last
  linkedin:
    enabled: true
    mode: apify
    actor: linkedin
  instagram:
    enabled: true
    mode: apify
    actor: instagram
  telegram:
    enabled: true
    mode: apify
    actor: telegram
  quora:
    enabled: true
    mode: apify
    actor: quora
  reddit:
    enabled: true
    mode: brightdata
    dataset: reddit_posts
    extra_input:
      date: "Past month"          # known-valid Bright Data preset ("Past year" hangs the job)
      sort_by: "New"
      num_of_posts: 60
  youtube:
    enabled: true
    mode: brightdata
    dataset: youtube_videos
    extra_input:
      country: "SG"
      num_of_posts: 40            # cap YouTube records to control cost

# LinkedIn scraper (ToS-gated). The unofficial linkedin-api library logs in with a real
# account, which VIOLATES LinkedIn's User Agreement and risks account suspension / legal
# action. It is DISABLED unless you both set mode: live above AND acknowledge the risk here,
# and provide LINKEDIN_USERNAME / LINKEDIN_PASSWORD in .env. Prefer a licensed data provider.
linkedin:
  tos_acknowledged: false       # set true ONLY if you accept the ToS/account/legal risk
  company: "prudential-singapore"

# Privacy / compliance controls
privacy:
  hash_author_ids: true         # SHA-256 pseudonymize author identifiers in stored cases
  retention_days: 90            # purge case files older than this on startup

# RACM control + KRI reference for each risk category (drop in your real refs)
racm_mapping:
  REPUTATIONAL:
    racm_ref: "RACM-REP-01"
    kri_ref: "KRI-REP-NEGSENT"
  COMPLIANCE_CONDUCT:
    racm_ref: "RACM-CMP-04"
    kri_ref: "KRI-CMP-VIOL"
  MARKET_ABUSE:
    racm_ref: "RACM-MAB-02"
    kri_ref: "KRI-MAB-SUSP"
  CYBER_OPERATIONAL:
    racm_ref: "RACM-CYB-03"
    kri_ref: "KRI-CYB-LEAK"

# Escalation recipients (prototype LogEscalator just records these)
escalation:
  high:   ["compliance-duty@prudential.example", "soc@prudential.example"]
  medium: ["risk-review@prudential.example"]
